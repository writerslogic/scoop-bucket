name: Excavator

on:
  schedule:
    - cron: '0 */6 * * *'  # Every 6 hours
  workflow_dispatch:

# REQUIRED: without this the job gets the repo's default (read-only) token and
# every run's "Commit and push changes" step 403s after `scoop checkver`
# already did the work — verified live (run 34425613735): the update commits
# fine locally, then `git push` fails with "Permission ... denied to
# github-actions[bot]". update-formula.yml and update-cask.yml in the
# sibling homebrew-tap repo already declare this; this workflow just never did.
permissions:
  contents: write

jobs:
  excavate:
    name: Update Manifests
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Scoop
        uses: MinoruSekine/setup-scoop@v4.0.1

      - name: Install dependencies
        run: |
          scoop install main/git
          # Add main bucket only if not already present
          $buckets = scoop bucket list
          if (-not ($buckets -match "^main")) {
            scoop bucket add main
          }
        continue-on-error: true

      - name: Update manifests
        run: |
          # Run checkver to find outdated manifests
          scoop checkver --all --update
        continue-on-error: true

      - name: Check for changes
        id: changes
        run: |
          $changes = git status --porcelain
          if ($changes) {
            echo "has_changes=true" >> $env:GITHUB_OUTPUT
          } else {
            echo "has_changes=false" >> $env:GITHUB_OUTPUT
          }

      - name: Commit and push changes
        if: steps.changes.outputs.has_changes == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # Only the manifest scoop's own checkver/autoupdate can have changed.
          # `git add -A` previously swept up install.ps1, an unrelated artifact
          # the scoop setup action drops in the checkout root, and committed it
          # to this repo (verified live, run 34425613735: "1 file changed, 787
          # insertions", the file being install.ps1, not the manifest).
          git add writerslogic.json
          $staged = git diff --cached --name-only
          if (-not $staged) {
            Write-Output "No manifest changes"
            exit 0
          }
          git commit -m "chore: auto-update manifests [skip ci]"
          git push
