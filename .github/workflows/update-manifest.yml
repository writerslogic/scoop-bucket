name: Update Manifest

on:
  repository_dispatch:
    types: [update-manifest]

permissions:
  contents: write

jobs:
  update:
    name: Update Manifest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Update manifest
        env:
          TAG: ${{ github.event.client_payload.tag }}
          VERSION: ${{ github.event.client_payload.version }}
          SHA256_WIN: ${{ github.event.client_payload.sha256_win }}
        run: |
          cat > writerslogic.json << EOF
          {
              "\$schema": "https://raw.githubusercontent.com/ScoopInstaller/Scoop/master/schema.json",
              "version": "${VERSION}",
              "description": "Cryptographic authorship witnessing for writers and creators",
              "homepage": "https://writersproof.com",
              "license": "AGPL-3.0-only",
              "notes": "Run 'writersproof-cli init' to get started. See https://writersproof.com for documentation.",
              "architecture": {
                  "64bit": {
                      "url": "https://updates.writerslogic.com/cli/writersproof-cli-${TAG}-x86_64-pc-windows-msvc.zip",
                      "hash": "${SHA256_WIN}"
                  }
              },
              "bin": [
                  "writersproof-cli.exe"
              ],
              "checkver": {
                  "url": "https://raw.githubusercontent.com/writerslogic/homebrew-tap/main/Formula/writersproof.rb",
                  "regex": "version \"([0-9.]+)\""
              },
              "autoupdate": {
                  "architecture": {
                      "64bit": {
                          "url": "https://updates.writerslogic.com/cli/writersproof-cli-v\$version-x86_64-pc-windows-msvc.zip"
                      }
                  }
              }
          }
          EOF

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add writerslogic.json
          git commit -m "chore: update writerslogic to ${{ github.event.client_payload.version }}"
          git push
