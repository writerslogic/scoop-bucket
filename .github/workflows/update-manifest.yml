name: Update Manifest

on:
  repository_dispatch:
    types: [update-manifest]

permissions:
  contents: write

jobs:
  update:
    name: Update Manifest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Update manifest
        env:
          TAG: ${{ github.event.client_payload.tag }}
          VERSION: ${{ github.event.client_payload.version }}
          SHA256_WIN: ${{ github.event.client_payload.sha256_win }}
          SHA256_WIN_ARM: ${{ github.event.client_payload.sha256_win_arm }}
        run: |
          set -euo pipefail
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ && "$TAG" = "v$VERSION" ]] \
            || { echo "::error::invalid release version/tag"; exit 1; }
          for HASH in "$SHA256_WIN" "$SHA256_WIN_ARM"; do
            [[ "$HASH" =~ ^[a-f0-9]{64}$ ]] || { echo "::error::both Windows hashes are required"; exit 1; }
          done
          cat > writerslogic.json << EOF
          {
              "\$schema": "https://raw.githubusercontent.com/ScoopInstaller/Scoop/master/schema.json",
              "version": "${VERSION}",
              "description": "Cryptographic authorship witnessing for writers and creators",
              "homepage": "https://writersproof.com",
              "license": "AGPL-3.0-only",
              "notes": "Run 'writersproof-cli init' to get started. See https://writersproof.com for documentation.",
              "architecture": {
                  "64bit": {
                      "url": "https://updates.writerslogic.com/cli/writersproof-cli-${TAG}-x86_64-pc-windows-msvc.zip",
                      "hash": "${SHA256_WIN}"
                  },
                  "arm64": {
                      "url": "https://updates.writerslogic.com/cli/writersproof-cli-${TAG}-aarch64-pc-windows-msvc.zip",
                      "hash": "${SHA256_WIN_ARM}"
                  }
              },
              "bin": [
                  "writersproof-cli.exe"
              ],
              "checkver": {
                  "url": "https://raw.githubusercontent.com/writerslogic/homebrew-tap/main/Formula/writersproof.rb",
                  "regex": "version \"([0-9.]+)\""
              },
              "autoupdate": {
                  "architecture": {
                      "64bit": {
                          "url": "https://updates.writerslogic.com/cli/writersproof-cli-v\$version-x86_64-pc-windows-msvc.zip"
                      },
                      "arm64": {
                          "url": "https://updates.writerslogic.com/cli/writersproof-cli-v\$version-aarch64-pc-windows-msvc.zip"
                      }
                  }
              }
          }
          EOF

      - name: Commit and push
        env:
          VERSION: ${{ github.event.client_payload.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add writerslogic.json
          git diff --cached --quiet && echo "No changes" && exit 0
          git commit -m "chore: update writerslogic to $VERSION"
          git push
